name: CI/CD

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker
        run: docker compose build

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag da imagem
        run: docker tag projeto-curso-api:latest ${{ secrets.DOCKER_USERNAME }}/projeto-curso-api:latest:${{ github.run_number }}

      - name: Push da imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/projeto-curso-api:latest:${{ github.run_number }}