sudo: require
dist: bionic
language: csharp
mono: none
dotnet: 8.0

services:
  - docker
before_install:
  - echo "We are in the right folder!"
script:
  - docker-compose build
before_deploy:
  - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
deploy:
  provider: script
  script:
    docker tag projeto-curso-api:latest $DOCKER_USERNAME/projeto-curso-api:latest:$TRAVIS_JOB_ID;
    docker push $DOCKER_USERNAME/projeto-curso-api:latest:$TRAVIS_JOB_ID;
  on:
    branch: dev